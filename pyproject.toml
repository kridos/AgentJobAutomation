[project]
name = "automator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.25.0",
    "APScheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
research = ["playwright>=1.40.0"]

[project.scripts]
automator = "automator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
py-modules = [
    "pipeline", "generator", "researcher", "scraper", "gmail_reader",
    "job_fetcher", "factual_validator", "scorer", "archive_processed",
    "manual_run", "crawl4ai_scraper", "accomplishments", "outreach",
]
packages = ["automator"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
