ollama:
  base_url: "http://localhost:11434"
  model: "qwen3:14b"
  temperature: 0.3
  max_tokens: 4096

validation:
  mode: "balanced"        # warn-only | balanced
  retry_count: 1           # balanced mode uses one corrective retry
  semantic_check: true    # LLM-based check for fabrications the regex checks can't enumerate

scraper:
  repo: ""  # leave empty to auto-detect: tries 2027 first, falls back to 2026
  branch: "dev"  # SimplifyJobs uses dev branch for current listings

gmail:
  max_results: 5           # emails to fetch when cross-referencing a company
  recruiter_scan_limit: 30 # emails to scan for independent recruiter listings

crawl4ai:
  enabled: false          # set to true to scrape additional job boards (LinkedIn, Glassdoor, etc.)
  limits:
    linkedin: 15          # max listings to scrape per board
    glassdoor: 20

scoring:
  enabled: true
  rewrite_threshold: 65   # trigger one quality-improvement rewrite if overall score is below this

research:
  enabled: true
  timeout_seconds: 30

accomplishments:
  auto_flush_after_run: false  # automatically flush recent_updates.md into accomplishments.md after each successful run

outreach:
  discover:
    batches_back: 2   # scrape current YC batch + this many prior batches
    limit: 50          # cap new companies added per discover run

output:
  base_dir: "output"
  processed_file: "processed.json"
  fetch_job_descriptions: true  # fetch full posting text from listing URLs

schedule:
  interval_hours: 24
